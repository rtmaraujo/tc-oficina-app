name: CI/CD

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  AWS_REGION: us-west-2

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build e Testes
        run: mvn clean verify

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker-build:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URL"

      - name: Build e Push da Imagem
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          docker build \
            -t "$ECR_REPOSITORY_URL:${{ github.sha }}" \
            -t "$ECR_REPOSITORY_URL:latest" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg COMMIT_SHA="${{ github.sha }}" \
            .
          docker push "$ECR_REPOSITORY_URL:${{ github.sha }}"
          docker push "$ECR_REPOSITORY_URL:latest"

  deploy-homologacao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/homologacao'
    needs: docker-build
    runs-on: ubuntu-latest
    environment: homologacao

    env:
      NAMESPACE: tc-oficina-homolog
      ECR_IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Kubeconfig EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Obter Manifestos (tc-oficina-infra-k8s)
        uses: actions/checkout@v4
        with:
          repository: rtmaraujo/tc-oficina-infra-k8s
          path: infra-k8s

      - name: Renderizar e Aplicar Manifestos (homologacao)
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          ECR_IMAGE: ${{ env.ECR_IMAGE }}
          RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          ADMIN_USUARIO: ${{ secrets.ADMIN_USUARIO }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          mkdir -p rendered
          for f in infra-k8s/k8s/*.yaml; do
            envsubst < "$f" > "rendered/$(basename "$f")"
          done
          kubectl apply -f rendered/

      - name: Aguardar Rollout
        run: |
          kubectl rollout status deployment/app-deployment \
            -n "${{ env.NAMESPACE }}" --timeout=300s
          kubectl get pods -n "${{ env.NAMESPACE }}"

      - name: Smoke Test (healthcheck)
        run: |
          kubectl port-forward svc/app-service -n "${{ env.NAMESPACE }}" 18080:80 >/dev/null 2>&1 &
          PID=$!
          trap "kill $PID" EXIT
          sleep 8
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/actuator/health; then
              echo ""
              echo "Healthcheck OK (homologacao)"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck falhou em homologacao"
          exit 1

  deploy-producao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    environment: producao

    env:
      NAMESPACE: tc-oficina
      ECR_IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Kubeconfig EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Obter Manifestos (tc-oficina-infra-k8s)
        uses: actions/checkout@v4
        with:
          repository: rtmaraujo/tc-oficina-infra-k8s
          path: infra-k8s

      - name: Renderizar e Aplicar Manifestos (producao)
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          ECR_IMAGE: ${{ env.ECR_IMAGE }}
          RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          ADMIN_USUARIO: ${{ secrets.ADMIN_USUARIO }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          mkdir -p rendered
          for f in infra-k8s/k8s/*.yaml; do
            envsubst < "$f" > "rendered/$(basename "$f")"
          done
          kubectl apply -f rendered/

      - name: Aguardar Rollout
        run: |
          kubectl rollout status deployment/app-deployment \
            -n "${{ env.NAMESPACE }}" --timeout=300s
          kubectl get pods -n "${{ env.NAMESPACE }}"

      - name: Smoke Test (healthcheck)
        run: |
          kubectl port-forward svc/app-service -n "${{ env.NAMESPACE }}" 18080:80 >/dev/null 2>&1 &
          PID=$!
          trap "kill $PID" EXIT
          sleep 8
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/actuator/health; then
              echo ""
              echo "Healthcheck OK (producao)"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck falhou em producao"
          exit 1