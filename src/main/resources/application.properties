spring.application.name=tc-oficina-app

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/oficina_db
spring.datasource.username=oficina_user
spring.datasource.password=oficina_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.url=/v3/api-docs
springdoc.show-actuator=false
springdoc.api-docs.groups.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Logging
logging.level.root=INFO
logging.level.br.com.fiap=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springdoc=DEBUG

# JWT - Read from environment variable, fallback to default for development
jwt.secret=${JWT_SECRET:mySecretKeyForJwtTokenGenerationThatIsLongEnough}

# credenciais para admin da oficina para nao criar uma tabela de usuarios
admin.usuario=${ADMIN_USUARIO:admin}
admin.senha=${ADMIN_SENHA:admin123}

management.endpoints.web.exposure.include=health,info

# CORS - origens permitidas (separadas por virgula). Use * para todas (apenas dev)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}